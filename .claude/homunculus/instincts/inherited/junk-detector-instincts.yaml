# Junk Detector Workflow Feature Test Coverage Workflow

## Action

Follow the feature-test-coverage-workflow workflow:
1. Write or update test files for the target module(s) in tests/
2. Optionally update or create a feature JSON file in .agents/tasks/task-coverage-75/features/ (e.g., FEAT-003.json, FEAT-004.json, FEAT-006.json)
3. Commit test files and feature JSON together
4. In a subsequent commit, mark the feature as completed by updating the same feature JSON file

## Evidence

- Workflow detected from commit patterns
- Frequency: ~3x per month
- Files: tests/test_*.py, .agents/tasks/task-coverage-75/features/FEAT-*.json

