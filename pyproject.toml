[project]
name = "junk-detector"
version = "0.1.0"
description = "AI content quality scorer — detect junk content with LLM-as-Judge + rules"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Junk Detector Contributors"}]
keywords = ["junk-detection", "content-quality", "chinese-nlp", "scam-detection", "clickbait", "rules-engine"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Text Processing :: Linguistic",
    "Natural Language :: Chinese (Simplified)",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "typer[all]>=0.12.0",
    "litellm>=1.40.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "passlib[bcrypt]>=1.7.0",
    "PyJWT>=2.8.0",
    "python-multipart>=0.0.29",
    "feedparser>=6.0.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40.0",
]
crawler-auth = [
    "playwright>=1.40.0",
]
ml = [
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]
postgres = [
    "asyncpg>=0.29.0",
]

[project.scripts]
junk-detector = "src.cli.main:app"

[project.urls]
Homepage = "https://github.com/kileroppo/junk-detector"
Repository = "https://github.com/kileroppo/junk-detector"
Issues = "https://github.com/kileroppo/junk-detector/issues"
Documentation = "https://github.com/kileroppo/junk-detector#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
exclude = [".ai-system"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501", "N806", "N817"]

[tool.ruff.lint.per-file-ignores]
"src/api/app.py" = ["E402"]
"src/cli/main.py" = ["E402"]

[tool.coverage.run]
omit = ["src/extractors/playwright_web.py"]

[tool.coverage.report]
exclude_also = [
    "pragma: no cover",
    "if __name__ == .__main__.",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
