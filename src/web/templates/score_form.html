{% extends "base.html" %}

{% block title %}内容评分 - Junk Detector{% endblock %}
{% block nav_score %}text-indigo-400 bg-[#334155]{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
    <h1 class="text-2xl font-bold">内容评分</h1>
    <p class="text-gray-400">输入文本或 URL，AI 将从9个维度分析内容质量。</p>

    <!-- Tab Navigation -->
    <div class="border-b border-[#334155]">
        <div class="flex space-x-0">
            <button onclick="switchTab('text')"
                    id="tab-text"
                    class="tab-btn active px-6 py-3 text-sm font-medium border-b-2 border-transparent hover:text-indigo-400 transition-colors inline-flex items-center gap-1.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                文本
            </button>
            <button onclick="switchTab('url')"
                    id="tab-url"
                    class="tab-btn px-6 py-3 text-sm font-medium border-b-2 border-transparent hover:text-indigo-400 transition-colors inline-flex items-center gap-1.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
                URL
            </button>
        </div>
    </div>

    <!-- Text Tab Content -->
    <div id="content-text" class="tab-content active">
        <form hx-post="/score-submit"
              hx-target="#result-container"
              hx-swap="innerHTML"
              hx-indicator="#loading-indicator"
              class="space-y-4">
            <input type="hidden" name="input_type" value="text">
            <div>
                <label for="title-input" class="block text-sm font-medium text-gray-300 mb-1">标题（可选）</label>
                <input type="text" id="title-input" name="title" placeholder="内容标题..."
                       class="w-full bg-[#0f172a] border border-[#334155] rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 placeholder-gray-500">
            </div>
            <div>
                <label for="text-input" class="block text-sm font-medium text-gray-300 mb-1">内容文本</label>
                <textarea id="text-input" name="text" rows="10" placeholder="粘贴需要评分的文本内容..."
                          class="w-full bg-[#0f172a] border border-[#334155] rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 placeholder-gray-500 resize-y"
                          oninput="document.getElementById('char-count').textContent = this.value.length"
                          required></textarea>
                <div class="flex justify-between mt-1">
                    <span class="text-xs text-gray-500">Ctrl+Enter 快速提交</span>
                    <span class="text-xs text-gray-500"><span id="char-count">0</span> 字</span>
                </div>
            </div>
            <button type="submit"
                    class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 px-8 py-3 rounded-lg font-medium transition-colors flex items-center justify-center gap-2">
                <span>开始评分</span>
                <span id="loading-indicator" class="htmx-indicator spinner"></span>
            </button>
        </form>
    </div>

    <!-- URL Tab Content -->
    <div id="content-url" class="tab-content">
        <form hx-post="/score-submit"
              hx-target="#result-container"
              hx-swap="innerHTML"
              hx-indicator="#loading-indicator-url"
              class="space-y-4">
            <input type="hidden" name="input_type" value="url">
            <div>
                <label for="url-input" class="block text-sm font-medium text-gray-300 mb-1">网页 URL</label>
                <input type="url" id="url-input" name="url" placeholder="https://example.com/article..."
                       class="w-full bg-[#0f172a] border border-[#334155] rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 placeholder-gray-500"
                       required>
            </div>
            <p class="text-xs text-gray-500">将自动提取网页正文内容进行评分</p>
            <button type="submit"
                    class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 px-8 py-3 rounded-lg font-medium transition-colors flex items-center justify-center gap-2">
                <span>开始评分</span>
                <span id="loading-indicator-url" class="htmx-indicator spinner"></span>
            </button>
        </form>
    </div>

    <!-- Result Container (HTMX will inject result here) -->
    <div id="result-container"></div>
</div>

<script>
function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    document.getElementById('content-' + tab).classList.add('active');
}

document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        var activeForm = document.querySelector('.tab-content.active form');
        if (activeForm) activeForm.requestSubmit();
    }
});
</script>
{% endblock %}
