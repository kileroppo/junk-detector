{% extends "base.html" %}

{% block title %}内容评分 - Junk Detector{% endblock %}
{% block nav_score %}is-active{% endblock %}

{% block content %}
<div class="score-page max-w-3xl mx-auto space-y-6">
    <div id="score-input-panel" class="space-y-8">
    <header class="page-header">
        <h1 class="page-title">内容评分</h1>
        <p class="page-subtitle">粘贴文本或链接，从九个维度得到清晰的质量判断。</p>
    </header>

    <div class="segmented-control w-full sm:w-auto" role="tablist" aria-label="输入方式">
        <button type="button" onclick="switchTab('text')" id="tab-text" role="tab" class="tab-btn flex-1 sm:flex-none">文本</button>
        <button type="button" onclick="switchTab('url')" id="tab-url" role="tab" aria-selected="true" class="tab-btn active flex-1 sm:flex-none">链接</button>
        <button type="button" onclick="switchTab('batch')" id="tab-batch" role="tab" class="tab-btn flex-1 sm:flex-none">批量</button>
    </div>

    <div id="content-text" class="tab-content">
        <div class="panel">
        <form hx-post="/score-submit"
              hx-target="#result-container"
              hx-swap="innerHTML"
              hx-indicator="#loading-indicator"
              class="space-y-4">
            <input type="hidden" name="input_type" value="text">
            <div>
                <label for="title-input" class="block text-sm font-medium text-gray-300 mb-1.5">标题（可选）</label>
                <input type="text" id="title-input" name="title" placeholder="内容标题" class="theme-input">
            </div>
            <div>
                <label for="text-input" class="block text-sm font-medium text-gray-300 mb-1.5">内容</label>
                <textarea id="text-input" name="text" rows="10" placeholder="粘贴需要评分的正文…"
                          class="theme-input resize-y min-h-[12rem]"
                          oninput="document.getElementById('char-count').textContent = this.value.length"
                          required></textarea>
                <div class="flex justify-between mt-2 text-xs text-gray-500">
                    <span>Ctrl+Enter 提交</span>
                    <span><span id="char-count">0</span> 字</span>
                </div>
            </div>
            <button type="submit" class="btn-primary w-full sm:w-auto">
                <span>开始评分</span>
                <span id="loading-indicator" class="htmx-indicator spinner"></span>
            </button>
        </form>
        </div>
    </div>

    <div id="content-url" class="tab-content active">
        <div class="panel">
        <form hx-post="/score-submit"
              hx-target="#result-container"
              hx-swap="innerHTML"
              hx-indicator="#loading-indicator-url"
              class="space-y-4">
            <input type="hidden" name="input_type" value="url">
            <div>
                <label for="url-input" class="block text-sm font-medium text-gray-300 mb-1.5">网页链接</label>
                <input type="url" id="url-input" name="url" placeholder="https://example.com/article"
                       class="theme-input" required>
            </div>
            <p class="text-sm text-gray-500">自动提取正文并评分</p>
            <button type="submit" class="btn-primary w-full sm:w-auto">
                <span>开始评分</span>
                <span id="loading-indicator-url" class="htmx-indicator spinner"></span>
            </button>
        </form>
        </div>
    </div>

    <div id="content-batch" class="tab-content">
        <div class="panel">
        <form hx-post="/score-batch"
              hx-target="#result-container"
              hx-swap="innerHTML"
              hx-indicator="#loading-indicator-batch"
              class="space-y-4"
              data-use-htmx="true">
            <div>
                <label for="batch-urls" class="block text-sm font-medium text-gray-300 mb-1.5">链接列表（每行一个）</label>
                <textarea id="batch-urls" name="urls" rows="8" placeholder="https://example.com/one&#10;https://example.com/two"
                          class="theme-input resize-y font-mono text-sm" required></textarea>
            </div>
            <div id="batch-drop-zone"
                 class="theme-inset rounded-2xl p-6 text-center text-gray-500 cursor-pointer transition-colors hover:border-indigo-500/40">
                <p class="text-sm">拖放 URL 文本文件到此处</p>
            </div>
            <button type="submit" class="btn-primary w-full sm:w-auto">
                <span>批量评分</span>
                <span id="loading-indicator-batch" class="htmx-indicator spinner"></span>
            </button>
        </form>
        </div>
    </div>
    </div>

    <!-- Result Container (HTMX / SSE injects result here) -->
    <div id="result-container"></div>
</div>

<script>
function enterReadingMode() {
    var page = document.querySelector('.score-page');
    var container = document.getElementById('result-container');
    if (!page || !container || !container.innerHTML.trim()) return;
    page.classList.add('reading-mode');
    requestAnimationFrame(function() {
        container.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
}

function exitReadingMode() {
    var page = document.querySelector('.score-page');
    var container = document.getElementById('result-container');
    if (page) page.classList.remove('reading-mode');
    if (container) container.innerHTML = '';
    if (typeof window.focusActiveScoreInput === 'function') {
        window.focusActiveScoreInput();
    }
}
window.enterReadingMode = enterReadingMode;
window.exitReadingMode = exitReadingMode;

function focusActiveScoreInput() {
    var panel = document.querySelector('.tab-content.active');
    if (!panel) return;
    var field = panel.querySelector('#url-input, #text-input, #batch-urls');
    if (!field || typeof field.focus !== 'function') return;
    try {
        field.focus({ preventScroll: false });
    } catch (err) {
        field.focus();
    }
}
window.focusActiveScoreInput = focusActiveScoreInput;

function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    document.getElementById('content-' + tab).classList.add('active');
    requestAnimationFrame(focusActiveScoreInput);
}

document.addEventListener('DOMContentLoaded', function() {
    requestAnimationFrame(focusActiveScoreInput);
});

document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        var activeForm = document.querySelector('.tab-content.active form');
        if (activeForm) activeForm.requestSubmit();
    }
});

// SSE Streaming scoring
function startStreamScoring(formData) {
    var container = document.getElementById('result-container');
    container.innerHTML = '<div class="scoring-progress"><div class="scoring-progress-stages"><span class="stage active">规则检测</span><span class="stage">LLM 分析</span><span class="stage">生成结果</span></div></div>';

    fetch('/score-stream', {
        method: 'POST',
        body: formData
    }).then(function(response) {
        var reader = response.body.getReader();
        var decoder = new TextDecoder();
        var buffer = '';

        function processChunk(chunk) {
            buffer += decoder.decode(chunk.value || new Uint8Array(), { stream: !chunk.done });
            var lines = buffer.split('\n');
            buffer = lines.pop() || '';

            var eventType = '';
            var dataLines = [];

            for (var i = 0; i < lines.length; i++) {
                var line = lines[i];
                if (line.startsWith('event: ')) {
                    eventType = line.substring(7);
                } else if (line.startsWith('data: ')) {
                    dataLines.push(line.substring(6));
                } else if (line === '' && eventType && dataLines.length > 0) {
                    handleSSEEvent(eventType, dataLines.join('\n'));
                    eventType = '';
                    dataLines = [];
                }
            }
        }

        function read() {
            reader.read().then(function(chunk) {
                processChunk(chunk);
                if (!chunk.done) read();
            });
        }
        read();
    }).catch(function(err) {
        renderFetchError(container, {
            title: '连接中断',
            reason: '与服务器通信失败，评分未完成。',
            hints: ['请检查网络后重试。', '若问题持续，可刷新页面后再提交。'],
            detail: err.message
        });
    });
}

function escapeHtml(text) {
    if (window.ResultPage && window.ResultPage.escapeHtml) {
        return window.ResultPage.escapeHtml(text);
    }
    var div = document.createElement('div');
    div.textContent = text == null ? '' : String(text);
    return div.innerHTML;
}

function renderFetchError(container, fetchError) {
    var level = fetchError.level || 'error';
    var isWarning = level === 'warning';
    var borderCls = isWarning ? 'bg-amber-950/40 border-amber-700/60' : 'bg-red-950/40 border-red-700/60';
    var titleCls = isWarning ? 'text-amber-200' : 'text-red-200';
    var reasonCls = isWarning ? 'text-amber-100/90' : 'text-red-100/90';

    var html = '<div class="score-fetch-error rounded-xl border p-5 space-y-4 ' + borderCls + '">';
    html += '<h2 class="text-lg font-semibold ' + titleCls + '">' + escapeHtml(fetchError.title || '链接解析失败') + '</h2>';
    html += '<p class="text-sm ' + reasonCls + '">' + escapeHtml(fetchError.reason || '无法获取页面内容') + '</p>';
    if (fetchError.url) {
        html += '<p class="text-xs text-gray-500 break-all">链接：<span class="text-gray-400">' + escapeHtml(fetchError.url) + '</span></p>';
    }
    if (fetchError.hints && fetchError.hints.length) {
        html += '<div class="rounded-lg bg-navy-900/80 border border-navy-700 px-4 py-3">';
        html += '<p class="text-xs font-medium text-gray-400 uppercase tracking-wide mb-2">你可以尝试</p><ul class="text-sm text-gray-300 space-y-1.5 list-disc list-inside">';
        fetchError.hints.forEach(function(hint) {
            html += '<li>' + escapeHtml(hint) + '</li>';
        });
        html += '</ul></div>';
    }
    if (fetchError.code === 'auth_required') {
        html += '<p class="text-sm"><a href="/settings#cookies" class="text-amber-300 hover:text-amber-200 underline">前往 Cookie 设置</a></p>';
    }
    html += '</div>';
    container.innerHTML = html;
}

function renderSimpleFinalResult(container, data) {
    if (window.ResultPage && window.ResultPage.renderSimpleFinalResult) {
        window.ResultPage.renderSimpleFinalResult(container, data, { showExpand: false });
    }
    enterReadingMode();
}

function renderRulesPreview(container, data) {
    if (window.ResultPage && window.ResultPage.renderRulesPreview) {
        window.ResultPage.renderRulesPreview(container, data);
        return;
    }
    container.innerHTML = '<div class="scoring-progress"><div class="scoring-progress-stages"><span class="stage done">规则检测</span><span class="stage active">LLM 分析</span><span class="stage">生成结果</span></div></div>';
}

function handleSSEEvent(eventType, dataStr) {
    var container = document.getElementById('result-container');
    try {
        var data = JSON.parse(dataStr);
    } catch(e) { return; }

    if (eventType === 'rules_result') {
        renderRulesPreview(container, data);
    } else if (eventType === 'final_result') {
        if (data.record_id) {
            fetch('/result/' + data.record_id + '/fragment')
                .then(function(resp) { return resp.text(); })
                .then(function(html) {
                    container.innerHTML = html;
                    enterReadingMode();
                    if (window.ResultPage && window.ResultPage.initDimHelpToggles) {
                        window.ResultPage.initDimHelpToggles(container);
                    }
                    if (window.ResultPage && window.ResultPage.initDimensionLinks) {
                        window.ResultPage.initDimensionLinks(container);
                    }
                    if (window.bootFocusGuideUI) {
                        window.bootFocusGuideUI(container);
                    } else if (window.bootReadingMapMagnify) {
                        window.bootReadingMapMagnify(container);
                    }
                })
                .catch(function() {
                    renderSimpleFinalResult(container, data);
                });
            return;
        }
        renderSimpleFinalResult(container, data);
    } else if (eventType === 'error') {
        if (data.fetch_error) {
            renderFetchError(container, data.fetch_error);
        } else {
            renderFetchError(container, {
                title: '评分失败',
                reason: data.error || '未知错误',
                hints: ['请检查输入后重试。']
            });
        }
    }
}

// Intercept form submissions to use SSE streaming
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.tab-content form').forEach(function(form) {
        form.addEventListener('submit', function(e) {
            // Only intercept if not a fallback HTMX submission
            if (!e.target.hasAttribute('data-use-htmx')) {
                e.preventDefault();
                var formData = new FormData(e.target);
                startStreamScoring(formData);
            }
        });
    });

    // Batch drop zone
    var dropZone = document.getElementById('batch-drop-zone');
    if (dropZone) {
        dropZone.addEventListener('dragover', function(e) {
            e.preventDefault();
            dropZone.classList.add('border-indigo-500', 'text-indigo-400');
        });
        dropZone.addEventListener('dragleave', function(e) {
            e.preventDefault();
            dropZone.classList.remove('border-indigo-500', 'text-indigo-400');
        });
        dropZone.addEventListener('drop', function(e) {
            e.preventDefault();
            dropZone.classList.remove('border-indigo-500', 'text-indigo-400');
            var files = e.dataTransfer.files;
            if (files.length > 0) {
                var reader = new FileReader();
                reader.onload = function(evt) {
                    var textarea = document.getElementById('batch-urls');
                    if (textarea) textarea.value = evt.target.result;
                };
                reader.readAsText(files[0]);
            }
        });
    }

    document.body.addEventListener('htmx:afterSwap', function(event) {
        if (event.detail.target.id === 'result-container' && event.detail.target.innerHTML.trim()) {
            enterReadingMode();
            if (window.ResultPage && window.ResultPage.initDimHelpToggles) {
                window.ResultPage.initDimHelpToggles(event.detail.target);
            }
            if (window.ResultPage && window.ResultPage.initDimensionLinks) {
                window.ResultPage.initDimensionLinks(event.detail.target);
            }
            if (window.bootFocusGuideUI) {
                window.bootFocusGuideUI(event.detail.target);
            }
        }
    });
});
</script>
{% endblock %}
