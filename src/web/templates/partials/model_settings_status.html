<div class="rounded-lg px-4 py-3 text-sm border {% if llm.configured %}bg-emerald-900/30 border-emerald-700 text-emerald-300{% else %}bg-yellow-900/30 border-yellow-700 text-yellow-300{% endif %}">
    <div class="flex flex-wrap items-center gap-x-4 gap-y-1">
        <span class="font-medium">当前模型：{{ llm.model }}</span>
        {% if llm.api_base %}
        <span class="text-xs opacity-80 font-mono">{{ llm.api_base }}</span>
        {% endif %}
        {% if llm.api_key_masked %}
        <span class="text-xs opacity-80">Key: {{ llm.api_key_masked }}</span>
        {% elif llm.provider == 'ollama' %}
        <span class="text-xs opacity-80">本地 Ollama，无需 Key</span>
        {% else %}
        <span class="text-xs opacity-80">API Key 未配置</span>
        {% endif %}
    </div>
</div>
