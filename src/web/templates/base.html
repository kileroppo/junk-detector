<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Junk Detector{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="stylesheet" href="/static/style.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1',
                        surface: '#1f2937',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">
    <!-- Navigation -->
    <nav class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo -->
                <div class="flex items-center space-x-3">
                    <span class="text-2xl">🔍</span>
                    <span class="text-xl font-bold text-indigo-400">Junk Detector</span>
                </div>

                <!-- Desktop Navigation -->
                <div class="hidden md:flex items-center space-x-1">
                    <a href="/dashboard" class="px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-700 hover:text-indigo-400 transition-colors {% block nav_dashboard %}{% endblock %}">
                        仪表盘
                    </a>
                    <a href="/score-form" class="px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-700 hover:text-indigo-400 transition-colors {% block nav_score %}{% endblock %}">
                        评分
                    </a>
                    <a href="/history-page" class="px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-700 hover:text-indigo-400 transition-colors {% block nav_history %}{% endblock %}">
                        历史记录
                    </a>
                    <a href="/monitor-status" class="px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-700 hover:text-indigo-400 transition-colors {% block nav_monitor %}{% endblock %}">
                        监控
                    </a>
                </div>

                <!-- Mobile menu button -->
                <div class="md:hidden">
                    <button onclick="document.getElementById('mobile-menu').classList.toggle('hidden')"
                            class="p-2 rounded-lg hover:bg-gray-700">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Navigation -->
        <div id="mobile-menu" class="hidden md:hidden border-t border-gray-700">
            <div class="px-4 py-3 space-y-2">
                <a href="/dashboard" class="block px-3 py-2 rounded-lg hover:bg-gray-700">仪表盘</a>
                <a href="/score-form" class="block px-3 py-2 rounded-lg hover:bg-gray-700">评分</a>
                <a href="/history-page" class="block px-3 py-2 rounded-lg hover:bg-gray-700">历史记录</a>
                <a href="/monitor-status" class="block px-3 py-2 rounded-lg hover:bg-gray-700">监控</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6 fade-in">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 border-t border-gray-700 py-4">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm text-gray-500">
            Junk Detector v0.1 — AI 内容质量评分系统
        </div>
    </footer>
</body>
</html>
