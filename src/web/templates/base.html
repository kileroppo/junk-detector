<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI 内容质量评分系统 - 9维度智能分析">
    <meta name="theme-color" content="#0f172a">
    <title>{% block title %}Junk Detector{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="preload" href="/static/style.css" as="style">
    <style>
        /* Critical CSS - inline for fast first paint */
        body { font-family: 'Noto Sans SC', 'Inter', system-ui, -apple-system, sans-serif; line-height: 1.6; }
        .dark body, body.bg-gray-50.dark\:bg-navy-900 { background: #0f172a; color: #f1f5f9; }
        nav { background: #1e293b; border-bottom: 1px solid #334155; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        /* Simple mode: hide detailed sections */
        body.simple-mode .detail-section { display: none !important; }
        body.simple-mode .simple-hidden { display: none !important; }
        body.simple-mode .simple-only { display: block !important; }
    </style>
    <link rel="stylesheet" href="/static/style.css">
    <script>
        // Theme initialization - runs before render to prevent FOUC
        (function() {
            var theme = localStorage.getItem('theme') || 'dark';
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) {
                meta.setAttribute('content', theme === 'dark' ? '#0f172a' : '#ffffff');
            }
            // Simple mode initialization
            if (localStorage.getItem('simple_mode') === 'true') {
                document.body && document.body.classList.add('simple-mode');
            }
        })();

        // Simple mode: apply on DOMContentLoaded for body class
        document.addEventListener('DOMContentLoaded', function() {
            if (localStorage.getItem('simple_mode') === 'true') {
                document.body.classList.add('simple-mode');
                var btn = document.getElementById('simple-mode-btn');
                if (btn) btn.classList.add('active');
            }
        });

        function toggleSimpleMode() {
            var isSimple = document.body.classList.toggle('simple-mode');
            localStorage.setItem('simple_mode', isSimple ? 'true' : 'false');
            var btn = document.getElementById('simple-mode-btn');
            if (btn) {
                if (isSimple) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            }
        }

        function toggleTheme() {
            var isDark = document.documentElement.classList.toggle('dark');
            var theme = isDark ? 'dark' : 'light';
            localStorage.setItem('theme', theme);
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) {
                meta.setAttribute('content', isDark ? '#0f172a' : '#ffffff');
            }
            // Update toggle button UI
            var knob = document.getElementById('theme-toggle-knob');
            var desc = document.getElementById('theme-toggle-desc');
            var btn = document.getElementById('theme-toggle-btn');
            if (knob) {
                if (isDark) {
                    knob.classList.add('translate-x-6');
                    knob.classList.remove('translate-x-0');
                } else {
                    knob.classList.add('translate-x-0');
                    knob.classList.remove('translate-x-6');
                }
            }
            if (btn) {
                if (isDark) {
                    btn.classList.add('bg-indigo-600');
                    btn.classList.remove('bg-gray-300');
                } else {
                    btn.classList.add('bg-gray-300');
                    btn.classList.remove('bg-indigo-600');
                }
            }
            if (desc) {
                desc.textContent = isDark ? '\u5F53\u524D\u4E3A\u6DF1\u8272\u4E3B\u9898' : '\u5F53\u524D\u4E3A\u6D45\u8272\u4E3B\u9898';
            }
        }
    </script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Sans SC', 'Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        primary: { DEFAULT: '#6366f1', hover: '#4f46e5', light: '#818cf8' },
                        surface: { DEFAULT: '#1e293b', raised: '#253348' },
                        navy: { 900: '#0f172a', 800: '#1e293b', 700: '#334155', 600: '#475569', 500: '#64748b', 400: '#94a3b8' },
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-navy-900 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col font-sans">

                        <span class="inline-flex items-center gap-1.5">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                            设置

                    <button onclick="document.getElementById('mobile-menu').classList.toggle('hidden')"

                <a href="/dashboard" class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-navy-700">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                    仪表盘
                </a>

                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
                    评分
                </a>
                <a href="/history-page" class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-navy-700">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    历史记录
                </a>
                <a href="/monitor-status" class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-navy-700">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                    监控
                </a>
                <a href="/compare" class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-navy-700">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                    对比
                </a>
                <a href="/settings" class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-navy-700">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>

    <!-- Toast notification container -->
    <div id="toast-container" class="fixed top-20 right-4 z-[60] space-y-2 pointer-events-none"></div>

    <!-- Main Content -->
    <main id="main-content" class="flex-1 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6 fade-in">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white dark:bg-surface border-t border-gray-200 dark:border-navy-700 py-4">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm text-gray-500 flex items-center justify-center gap-3">
            <span>Junk Detector v0.1 - AI 内容质量评分系统</span>
            <button id="shortcut-help-btn" onclick="toggleShortcutOverlay()" class="w-6 h-6 rounded-full bg-navy-700 text-gray-400 text-xs font-bold hover:bg-indigo-600 hover:text-white transition-colors" title="键盘快捷键">?</button>
        </div>
    </footer>

    <!-- Keyboard shortcut overlay -->
    <div id="shortcut-overlay" class="fixed inset-0 z-[100] bg-black/60 flex items-center justify-center hidden" onclick="toggleShortcutOverlay()">
        <div class="bg-surface rounded-xl border border-navy-700 p-6 max-w-md w-full mx-4 shadow-2xl" onclick="event.stopPropagation()">
            <h3 class="text-lg font-bold mb-4 text-gray-100">键盘快捷键</h3>
            <div class="grid grid-cols-2 gap-3 text-sm">
                <div class="flex items-center gap-2"><kbd class="px-2 py-1 bg-navy-900 rounded text-xs font-mono border border-navy-700">/</kbd><span class="text-gray-300">聚焦输入框</span></div>
                <div class="flex items-center gap-2"><kbd class="px-2 py-1 bg-navy-900 rounded text-xs font-mono border border-navy-700">N</kbd><span class="text-gray-300">新建评分</span></div>
                <div class="flex items-center gap-2"><kbd class="px-2 py-1 bg-navy-900 rounded text-xs font-mono border border-navy-700">Esc</kbd><span class="text-gray-300">关闭菜单/面板</span></div>
                <div class="flex items-center gap-2"><kbd class="px-2 py-1 bg-navy-900 rounded text-xs font-mono border border-navy-700">J</kbd><span class="text-gray-300">下一条记录</span></div>
                <div class="flex items-center gap-2"><kbd class="px-2 py-1 bg-navy-900 rounded text-xs font-mono border border-navy-700">K</kbd><span class="text-gray-300">上一条记录</span></div>
                <div class="flex items-center gap-2"><kbd class="px-2 py-1 bg-navy-900 rounded text-xs font-mono border border-navy-700">?</kbd><span class="text-gray-300">显示帮助</span></div>
            </div>
            <button onclick="toggleShortcutOverlay()" class="mt-4 w-full py-2 rounded-lg bg-navy-700 text-gray-300 text-sm hover:bg-navy-600 transition-colors">关闭</button>
        </div>
    </div>

    <!-- Global keyboard shortcuts -->
    <script>
    function toggleShortcutOverlay() {
        var overlay = document.getElementById('shortcut-overlay');
        if (overlay) overlay.classList.toggle('hidden');
    }

    document.addEventListener('keydown', function(e) {
        var tag = e.target.tagName.toLowerCase();
        if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

        if (e.key === '/') {
            e.preventDefault();
            var input = document.querySelector('input[type="text"], input[type="url"], textarea');
            if (input) input.focus();
        } else if (e.key === 'n' || e.key === 'N') {
            window.location.href = '/score-form';
        } else if (e.key === 'Escape') {
            var menu = document.getElementById('mobile-menu');
            if (menu) menu.classList.add('hidden');
            var overlay = document.getElementById('shortcut-overlay');
            if (overlay && !overlay.classList.contains('hidden')) {
                overlay.classList.add('hidden');
                return;
            }
            document.querySelectorAll('details[open]').forEach(function(d) { d.removeAttribute('open'); });
        } else if (e.key === 'j' || e.key === 'J') {
            navigateHistoryItem(1);
        } else if (e.key === 'k' || e.key === 'K') {
            navigateHistoryItem(-1);
        } else if (e.key === '?') {
            toggleShortcutOverlay();
        }
    });

    var _currentHistoryIdx = -1;
    function navigateHistoryItem(direction) {
        var rows = document.querySelectorAll('table tbody tr, .sm\\:hidden a[href^="/result/"]');
        if (rows.length === 0) return;
        rows.forEach(function(r) { r.classList.remove('ring-2', 'ring-indigo-500'); });
        _currentHistoryIdx += direction;
        if (_currentHistoryIdx < 0) _currentHistoryIdx = 0;
        if (_currentHistoryIdx >= rows.length) _currentHistoryIdx = rows.length - 1;
        var target = rows[_currentHistoryIdx];
        target.classList.add('ring-2', 'ring-indigo-500');
        target.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
    </script>
</body>
</html>
