<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI 内容质量评分系统 - 9维度智能分析">
    <meta name="theme-color" content="#000000">
    <title>{% block title %}Junk Detector{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="preload" href="/static/style.css" as="style">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Noto Sans SC', system-ui, sans-serif; line-height: 1.5; }
        html.dark body { background: #000000; color: #f5f5f7; }
        html:not(.dark) body { background: #f5f5f7; color: #1d1d1f; }
        .fade-in { animation: fadeIn 0.22s cubic-bezier(0.25, 0.1, 0.25, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        body.simple-mode .detail-section { display: none !important; }
        body.simple-mode .simple-hidden { display: none !important; }
        body.simple-mode .simple-only { display: block !important; }
    </style>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/result_page.js" defer></script>
    <script src="/static/focus_guide.js" defer></script>
    <script>
        (function() {
            var theme = localStorage.getItem('theme') || 'dark';
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) {
                meta.setAttribute('content', theme === 'dark' ? '#000000' : '#f5f5f7');
            }
            if (localStorage.getItem('simple_mode') === 'true') {
                document.body && document.body.classList.add('simple-mode');
            }
        })();

        document.addEventListener('DOMContentLoaded', function() {
            if (localStorage.getItem('simple_mode') === 'true') {
                document.body.classList.add('simple-mode');
                var btn = document.getElementById('simple-mode-btn');
                if (btn) btn.classList.add('active');
            }
        });

        function toggleSimpleMode() {
            var isSimple = document.body.classList.toggle('simple-mode');
            localStorage.setItem('simple_mode', isSimple ? 'true' : 'false');
            ['simple-mode-btn', 'simple-mode-btn-mobile'].forEach(function(id) {
                var btn = document.getElementById(id);
                if (btn) btn.classList.toggle('active', isSimple);
            });
        }

        function syncThemeToggleUI() {
            var isDark = document.documentElement.classList.contains('dark');
            document.querySelectorAll('[data-theme-toggle]').forEach(function(btn) {
                var sun = btn.querySelector('[data-theme-icon="sun"]');
                var moon = btn.querySelector('[data-theme-icon="moon"]');
                if (sun) sun.classList.toggle('hidden', !isDark);
                if (moon) moon.classList.toggle('hidden', isDark);
                var label = isDark ? '\u5207\u6362\u6D45\u8272\u6A21\u5F0F' : '\u5207\u6362\u6DF1\u8272\u6A21\u5F0F';
                btn.setAttribute('title', label);
                btn.setAttribute('aria-label', label);
            });
        }

        document.addEventListener('DOMContentLoaded', syncThemeToggleUI);

        function toggleTheme() {
            var isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) {
                meta.setAttribute('content', isDark ? '#000000' : '#f5f5f7');
            }
            syncThemeToggleUI();
        }
    </script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            safelist: [
                'dark:bg-surface', 'dark:bg-navy-900', 'dark:bg-navy-800',
                'dark:border-navy-700', 'dark:text-gray-100', 'dark:text-gray-300',
                'bg-surface', 'bg-navy-900', 'border-navy-700', 'text-gray-100', 'text-gray-300', 'text-gray-400',
            ],
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'Noto Sans SC', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        primary: { DEFAULT: '#007aff', hover: '#005ecb', light: '#409cff' },
                        surface: { DEFAULT: '#2c2c2e', raised: '#3a3a3c' },
                        navy: { 900: '#1c1c1e', 800: '#2c2c2e', 700: '#3a3a3c', 600: '#48484a', 500: '#636366', 400: '#98989d' },
                    }
                }
            }
        }
    </script>
</head>
<body class="app-shell bg-gray-50 dark:bg-navy-900 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col font-sans">
    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-[100] focus:px-4 focus:py-2 focus:bg-indigo-600 focus:text-white focus:rounded-full">
        跳转到主要内容
    </a>

    <nav class="app-nav sticky top-0 z-50 bg-white/80 dark:bg-surface/80">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between gap-4">
                <a href="/dashboard" class="app-nav-brand shrink-0">Junk Detector</a>

                <div class="hidden md:flex items-center gap-1 flex-1 justify-center">
                    <a href="/dashboard" class="app-nav-link {% block nav_dashboard %}{% endblock %}">概览</a>
                    <a href="/history-page" class="app-nav-link {% block nav_history %}{% endblock %}">历史</a>
                    <details class="app-nav-more relative">
                        <summary class="app-nav-link">更多</summary>
                        <div class="app-nav-more-menu">
                            <a href="/monitor-status" class="{% block nav_monitor %}{% endblock %}">监控</a>
                            <a href="/compare" class="{% block nav_compare %}{% endblock %}">对比</a>
                        </div>
                    </details>
                </div>

                <div class="hidden md:flex items-center gap-2 shrink-0">
                    <button id="simple-mode-btn" type="button" onclick="toggleSimpleMode()"
                            class="btn-secondary !min-h-0 !py-1.5 !px-3 !text-xs" title="极简模式">极简</button>
                    <button type="button" data-theme-toggle onclick="toggleTheme()"
                            class="p-2 rounded-full text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-navy-800 transition-colors"
                            title="切换浅色模式" aria-label="切换浅色模式">
                        <svg data-theme-icon="sun" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
                        </svg>
                        <svg data-theme-icon="moon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                        </svg>
                    </button>
                    <a href="/settings" class="p-2 rounded-full text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-navy-800 transition-colors {% block nav_settings %}{% endblock %}"
                       title="设置" aria-label="设置">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                    </a>
                    <a href="/score-form" class="app-nav-cta {% block nav_score %}{% endblock %}" data-nav-score>评分</a>
                </div>

                <div class="md:hidden flex items-center gap-1 shrink-0">
                    <a href="/score-form" class="app-nav-cta !py-2 !px-3 !text-sm" data-nav-score>评分</a>
                    <button type="button" data-theme-toggle onclick="toggleTheme()"
                            class="p-2 rounded-full text-gray-500 dark:text-gray-400"
                            title="切换主题" aria-label="切换主题">
                        <svg data-theme-icon="sun" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
                        </svg>
                        <svg data-theme-icon="moon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                        </svg>
                    </button>
                    <button type="button" onclick="document.getElementById('mobile-menu').classList.toggle('hidden')"
                            class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-navy-800" aria-label="打开菜单">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M4 6h16M4 12h16M4 18h16"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <div id="mobile-menu" class="hidden md:hidden border-t border-gray-200 dark:border-navy-700 bg-white dark:bg-surface">
            <div class="px-4 py-3 space-y-1">
                <a href="/dashboard" class="app-nav-link w-full {% block nav_dashboard_mobile %}{% endblock %}">概览</a>
                <a href="/history-page" class="app-nav-link w-full">历史</a>
                <a href="/monitor-status" class="app-nav-link w-full">监控</a>
                <a href="/compare" class="app-nav-link w-full">对比</a>
                <a href="/settings" class="app-nav-link w-full">设置</a>
                <button type="button" id="simple-mode-btn-mobile" onclick="toggleSimpleMode()"
                        class="app-nav-link w-full text-left">极简模式</button>
            </div>
        </div>
    </nav>

    <div id="toast-container" class="fixed top-16 right-4 z-[60] space-y-2 pointer-events-none"></div>

    <main id="main-content" class="app-main flex-1 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 fade-in">
        {% block content %}{% endblock %}
    </main>

    <footer class="app-footer bg-white dark:bg-surface border-t border-gray-200 dark:border-navy-700">
        <div class="max-w-7xl mx-auto px-4 flex items-center justify-center gap-3">
            <span>Junk Detector v0.1 · AI 内容质量评分</span>
            <button type="button" id="shortcut-help-btn" onclick="toggleShortcutOverlay()"
                    class="w-7 h-7 rounded-full bg-navy-800 text-gray-400 text-xs font-semibold hover:bg-indigo-600 hover:text-white transition-colors"
                    title="键盘快捷键">?</button>
        </div>
    </footer>

    <div id="shortcut-overlay" class="fixed inset-0 z-[100] bg-black/50 backdrop-blur-sm flex items-center justify-center hidden" onclick="toggleShortcutOverlay()">
        <div class="panel max-w-md w-full mx-4 shadow-none" onclick="event.stopPropagation()">
            <h3 class="page-title !text-lg mb-4">键盘快捷键</h3>
            <div class="grid grid-cols-2 gap-3 text-sm">
                <div class="flex items-center gap-2"><kbd class="px-2 py-1 bg-navy-900 rounded-md text-xs font-mono border border-navy-700">/</kbd><span class="text-gray-400">聚焦输入</span></div>
                <div class="flex items-center gap-2"><kbd class="px-2 py-1 bg-navy-900 rounded-md text-xs font-mono border border-navy-700">N</kbd><span class="text-gray-400">新建评分</span></div>
                <div class="flex items-center gap-2"><kbd class="px-2 py-1 bg-navy-900 rounded-md text-xs font-mono border border-navy-700">Esc</kbd><span class="text-gray-400">关闭</span></div>
                <div class="flex items-center gap-2"><kbd class="px-2 py-1 bg-navy-900 rounded-md text-xs font-mono border border-navy-700">J</kbd><span class="text-gray-400">下一条</span></div>
                <div class="flex items-center gap-2"><kbd class="px-2 py-1 bg-navy-900 rounded-md text-xs font-mono border border-navy-700">K</kbd><span class="text-gray-400">上一条</span></div>
                <div class="flex items-center gap-2"><kbd class="px-2 py-1 bg-navy-900 rounded-md text-xs font-mono border border-navy-700">?</kbd><span class="text-gray-400">帮助</span></div>
            </div>
            <button type="button" onclick="toggleShortcutOverlay()" class="btn-secondary w-full mt-5">关闭</button>
        </div>
    </div>

    <script>
    function toggleShortcutOverlay() {
        var overlay = document.getElementById('shortcut-overlay');
        if (overlay) overlay.classList.toggle('hidden');
    }

    document.addEventListener('click', function(e) {
        var scoreNav = e.target.closest('[data-nav-score]');
        if (!scoreNav || window.location.pathname !== '/score-form') return;
        e.preventDefault();
        var resultBox = document.getElementById('result-container');
        if (resultBox) resultBox.innerHTML = '';
        if (typeof window.focusActiveScoreInput === 'function') {
            window.focusActiveScoreInput();
        }
    });

    document.addEventListener('keydown', function(e) {
        var tag = e.target.tagName.toLowerCase();
        if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

        if (e.key === '/') {
            e.preventDefault();
            if (window.location.pathname === '/score-form' && typeof window.focusActiveScoreInput === 'function') {
                window.focusActiveScoreInput();
                return;
            }
            var input = document.querySelector('input[type="text"], input[type="url"], textarea');
            if (input) input.focus();
        } else if (e.key === 'n' || e.key === 'N') {
            window.location.href = '/score-form';
        } else if (e.key === 'Escape') {
            var menu = document.getElementById('mobile-menu');
            if (menu) menu.classList.add('hidden');
            var overlay = document.getElementById('shortcut-overlay');
            if (overlay && !overlay.classList.contains('hidden')) {
                overlay.classList.add('hidden');
                return;
            }
            document.querySelectorAll('details[open]').forEach(function(d) { d.removeAttribute('open'); });
        } else if (e.key === 'j' || e.key === 'J') {
            navigateHistoryItem(1);
        } else if (e.key === 'k' || e.key === 'K') {
            navigateHistoryItem(-1);
        } else if (e.key === '?') {
            toggleShortcutOverlay();
        }
    });

    var _currentHistoryIdx = -1;
    function navigateHistoryItem(direction) {
        var rows = document.querySelectorAll('table tbody tr, .sm\\:hidden a[href^="/result/"]');
        if (rows.length === 0) return;
        rows.forEach(function(r) { r.classList.remove('ring-2', 'ring-indigo-500'); });
        _currentHistoryIdx += direction;
        if (_currentHistoryIdx < 0) _currentHistoryIdx = 0;
        if (_currentHistoryIdx >= rows.length) _currentHistoryIdx = rows.length - 1;
        var target = rows[_currentHistoryIdx];
        target.classList.add('ring-2', 'ring-indigo-500');
        target.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
    </script>
</body>
</html>
