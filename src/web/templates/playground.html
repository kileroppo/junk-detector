{% extends "base.html" %}

{% block title %}鉴真 API Playground{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-gray-100 mb-2">鉴真 API Playground</h1>
        <p class="text-gray-400">输入文本，体验内容质量检测</p>
    </div>

    <div class="bg-surface rounded-xl border border-navy-700 p-6 space-y-6">
        <!-- Input area -->
        <div>
            <label for="playground-input" class="block text-sm font-medium text-gray-300 mb-2">待检测文本</label>
            <textarea
                id="playground-input"
                rows="5"
                class="w-full px-4 py-3 bg-navy-900 border border-navy-700 rounded-lg text-gray-100 placeholder-gray-500 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 resize-y"
                placeholder="粘贴或输入需要检测的内容..."
            ></textarea>
        </div>

        <!-- Action button -->
        <div class="flex items-center justify-between">
            <button
                id="playground-btn"
                onclick="runDetection()"
                class="px-6 py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white font-medium rounded-lg transition-colors focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 focus:ring-offset-navy-900"
            >
                检测
            </button>
            <span class="text-xs text-gray-500">免费体验，每次最多5次请求</span>
        </div>

        <!-- Result area -->
        <div id="playground-result" class="hidden">
            <div class="border-t border-navy-700 pt-4">
                <h3 class="text-sm font-medium text-gray-300 mb-3">检测结果</h3>
                <pre id="playground-result-content" class="bg-navy-900 border border-navy-700 rounded-lg p-4 text-sm text-gray-200 overflow-x-auto whitespace-pre-wrap"></pre>
            </div>
        </div>

        <!-- Error area -->
        <div id="playground-error" class="hidden">
            <div class="bg-red-900/30 border border-red-700 rounded-lg p-4 text-red-300 text-sm"></div>
        </div>
    </div>
</div>

<script>
async function runDetection() {
    const input = document.getElementById('playground-input');
    const btn = document.getElementById('playground-btn');
    const resultArea = document.getElementById('playground-result');
    const resultContent = document.getElementById('playground-result-content');
    const errorArea = document.getElementById('playground-error');

    const text = input.value.trim();
    if (!text) {
        errorArea.classList.remove('hidden');
        errorArea.querySelector('div').textContent = '请输入待检测文本';
        resultArea.classList.add('hidden');
        return;
    }

    // Disable button and show loading state
    btn.disabled = true;
    btn.textContent = '检测中...';
    errorArea.classList.add('hidden');
    resultArea.classList.add('hidden');

    try {
        const response = await fetch('/demo', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({text: text})
        });

        if (!response.ok) {
            throw new Error('请求失败: ' + response.status);
        }

        const data = await response.json();
        resultContent.textContent = JSON.stringify(data, null, 2);
        resultArea.classList.remove('hidden');
    } catch (err) {
        errorArea.classList.remove('hidden');
        errorArea.querySelector('div').textContent = err.message || '检测失败，请稍后重试';
    } finally {
        btn.disabled = false;
        btn.textContent = '检测';
    }
}

// Allow Ctrl+Enter to submit
document.getElementById('playground-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        runDetection();
    }
});
</script>
{% endblock %}
