<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鉴真 - 欢迎</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f9fafb;
      color: #1f2937;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 480px;
      padding: 48px 32px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      text-align: center;
    }
    .brand-header {
      margin-bottom: 24px;
    }
    .brand-header h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }
    .brand-header .subtitle {
      font-size: 14px;
      color: #6b7280;
    }
    .body-text {
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 24px;
      color: #374151;
    }
    .sites-list {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 32px;
    }
    .sites-list li {
      padding: 6px 14px;
      background: #f3f4f6;
      border-radius: 20px;
      font-size: 13px;
      color: #4b5563;
    }
    .cta-button {
      display: inline-block;
      padding: 12px 32px;
      background: #10B981;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .cta-button:hover {
      background: #059669;
    }
    .color-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 24px;
    }
    .color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .color-dot.green { background: #10B981; }
    .color-dot.amber { background: #F59E0B; }
    .color-dot.red { background: #EF4444; }
    .color-legend {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand-header">
      <h1>&#x1F50D; 鉴真</h1>
      <p class="subtitle">一眼看穿垃圾信息</p>
    </div>
    <p class="body-text">
      鉴真已安装。访问微信公众号、知乎、小红书等页面即可自动检测。
    </p>
    <ul class="sites-list">
      <li>&#x1F4F1; 微信公众号</li>
      <li>&#x1F4DD; 知乎</li>
      <li>&#x1F4D6; 小红书</li>
      <li>&#x1F4BB; 掘金</li>
      <li>&#x1F4E2; 微博</li>
    </ul>
    <button class="cta-button" id="try-btn">试试看</button>
    <div class="color-bar">
      <span class="color-dot green"></span>
      <span class="color-dot amber"></span>
      <span class="color-dot red"></span>
    </div>
    <p class="color-legend">优质 / 可疑 / 垃圾</p>
  </div>
  <script>
    document.getElementById("try-btn").addEventListener("click", function() {
      window.open("https://mp.weixin.qq.com/s/example", "_blank");
    });
  </script>
</body>
</html>
