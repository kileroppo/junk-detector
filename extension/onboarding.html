<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鉴真 - 欢迎</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f9fafb;
      color: #1f2937;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 480px;
      padding: 48px 32px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      text-align: center;
    }
    .step {
      display: none;
      animation: fadeIn 0.3s ease;
    }
    .step.active {
      display: block;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .brand-header {
      margin-bottom: 24px;
    }
    .brand-header h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }
    .brand-header .subtitle {
      font-size: 14px;
      color: #6b7280;
    }
    .body-text {
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 24px;
      color: #374151;
    }
    .sites-list {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 32px;
    }
    .sites-list li {
      padding: 6px 14px;
      background: #f3f4f6;
      border-radius: 20px;
      font-size: 13px;
      color: #4b5563;
    }
    .cta-button {
      display: inline-block;
      padding: 12px 32px;
      background: #10B981;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      text-decoration: none;
    }
    .cta-button:hover {
      background: #059669;
    }
    .secondary-btn {
      display: inline-block;
      padding: 10px 24px;
      background: none;
      color: #6b7280;
      font-size: 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 12px;
      text-decoration: none;
    }
    .secondary-btn:hover {
      background: #f3f4f6;
    }
    .progress-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 32px;
    }
    .progress-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #d1d5db;
      transition: background 0.3s;
    }
    .progress-dot.active {
      background: #10B981;
    }
    .step-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    .link-card {
      display: block;
      padding: 12px 16px;
      margin: 12px 0;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      text-decoration: none;
      color: #374151;
      font-size: 14px;
      transition: background 0.2s, border-color 0.2s;
    }
    .link-card:hover {
      background: #f9fafb;
      border-color: #10B981;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Step 1: Welcome -->
    <div class="step active" id="step-1">
      <div class="brand-header">
        <h1>&#x1F50D; 鉴真已安装</h1>
        <p class="subtitle">一眼看穿垃圾信息</p>
      </div>
      <p class="body-text">
        鉴真会自动检测你阅读的内容质量，帮你识别虚假信息、营销软文和焦虑贩卖。
      </p>
      <ul class="sites-list">
        <li>&#x1F4F1; 微信公众号</li>
        <li>&#x1F4DD; 知乎</li>
        <li>&#x1F4D6; 小红书</li>
        <li>&#x1F4BB; 掘金</li>
        <li>&#x1F4E2; 微博</li>
      </ul>
      <button class="cta-button" id="next-1">下一步</button>
    </div>

    <!-- Step 2: Try it -->
    <div class="step" id="step-2">
      <div class="step-icon">&#x1F9EA;</div>
      <h2 style="margin-bottom:16px;">试试看</h2>
      <p class="body-text">
        打开一篇微信公众号文章，看看鉴真如何工作。
      </p>
      <a class="link-card" href="https://mp.weixin.qq.com/s/example" target="_blank">
        &#x1F4F1; 打开微信文章示例
      </a>
      <br>
      <button class="cta-button" id="next-2">下一步</button>
      <br>
      <button class="secondary-btn" id="back-2">返回</button>
    </div>

    <!-- Step 3: Settings -->
    <div class="step" id="step-3">
      <div class="step-icon">&#x2699;&#xFE0F;</div>
      <h2 style="margin-bottom:16px;">设置你的偏好</h2>
      <p class="body-text">
        根据你的需要调整检测灵敏度和通知方式。
      </p>
      <a class="link-card" href="options.html" target="_blank">
        &#x2699;&#xFE0F; 打开设置页面
      </a>
      <br>
      <button class="cta-button" id="finish-btn">开始使用</button>
      <br>
      <button class="secondary-btn" id="back-3">返回</button>
    </div>

    <!-- Progress dots -->
    <div class="progress-dots">
      <span class="progress-dot active" id="dot-1"></span>
      <span class="progress-dot" id="dot-2"></span>
      <span class="progress-dot" id="dot-3"></span>
    </div>
  </div>

  <script>
    (function () {
      var currentStep = 1;

      function showStep(step) {
        for (var i = 1; i <= 3; i++) {
          var stepEl = document.getElementById("step-" + i);
          var dotEl = document.getElementById("dot-" + i);
          if (i === step) {
            stepEl.classList.add("active");
            dotEl.classList.add("active");
          } else {
            stepEl.classList.remove("active");
            dotEl.classList.remove("active");
          }
        }
        currentStep = step;
      }

      document.getElementById("next-1").addEventListener("click", function () {
        showStep(2);
      });

      document.getElementById("next-2").addEventListener("click", function () {
        showStep(3);
      });

      document.getElementById("back-2").addEventListener("click", function () {
        showStep(1);
      });

      document.getElementById("back-3").addEventListener("click", function () {
        showStep(2);
      });

      document.getElementById("finish-btn").addEventListener("click", function () {
        window.close();
      });
    })();
  </script>
</body>
</html>
