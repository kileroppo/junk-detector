# Junk Detector Configuration

# Model presets - choose one as active
models:
  # Local Ollama (free, private, requires ollama running locally)
  ollama:
    primary: "ollama/qwen2.5:14b"
    fallback: "ollama/qwen2.5:7b"
    api_base: "http://localhost:11434"  # default Ollama endpoint

  # DeepSeek (cheap, good Chinese support)
  deepseek:
    primary: "deepseek/deepseek-chat"
    fallback: "deepseek/deepseek-chat"

  # OpenAI
  openai:
    primary: "gpt-4o-mini"
    fallback: "gpt-4o"

  # Anthropic
  anthropic:
    primary: "claude-sonnet-4-20250514"
    fallback: "claude-sonnet-4-20250514"

# Which model preset to use (one of: ollama, deepseek, openai, anthropic)
active_model: "deepseek"

# Scoring configuration
scoring:
  confidence_threshold: 0.7

  weights:
    originality: 1.0
    info_density: 1.0
    reasoning_quality: 1.0
    readability: 0.8
    timeliness: 0.6
    ai_generated_prob: -0.8
    emotional_manipulation: -1.0
    advertorial_prob: -1.0
    scam_prob: -1.2

  label_thresholds:
    可能AI生成: 70.0
    情绪操纵: 65.0
    疑似软文: 70.0
    疑似骗局: 60.0
    高质量原创: 80.0
    信息密度高: 80.0

# Embedding model for similarity detection (Task #2 will use this)
embedding:
  model: "ollama/nomic-embed-text"  # or "text-embedding-3-small" for OpenAI
  api_base: "http://localhost:11434"

# Summarization for long articles (Task #3 will use this)
summarization:
  enabled: true
  max_chars_before_summarize: 5000  # articles longer than this get summarized first
  model: null  # null = use same as active_model primary


# Source reputation system
sources:
  # Blacklisted domains — always penalize heavily
  blacklist:
    - "spam-domain.com"
    - "fake-news-site.cn"
  
  # Whitelisted domains — trusted sources, slight positive bias
  whitelist:
    - "nature.com"
    - "arxiv.org"
    - "github.com"
    - "zhihu.com"
  
  # Penalty/boost amounts (applied to overall_score)
  blacklist_penalty: 30    # subtract from overall score
  whitelist_boost: 5       # add to overall score
  
  # Auto-blacklist: if a source has N+ articles all scoring below threshold, auto-add to blacklist
  auto_blacklist:
    enabled: true
    min_articles: 5       # need at least 5 scored articles from this domain
    max_avg_score: 30     # if avg score is below this, auto-blacklist


# Platform-specific scoring profiles
# Inspired by x-algorithm's OON Scorer (different scoring for different content sources)
platforms:
  wechat:  # 公众号
    domains: ["mp.weixin.qq.com"]
    weight_overrides:
      advertorial_prob: -1.5    # higher penalty for soft ads (common in WeChat)
      emotional_manipulation: -1.2  # clickbait titles are epidemic
    extra_rules:
      - "关注公众号"    # self-promotion signal
      - "点击原文"
      - "长按识别"

  xiaohongshu:  # 小红书
    domains: ["xiaohongshu.com", "xhslink.com"]
    weight_overrides:
      advertorial_prob: -1.5    # very high soft-ad rate
      info_density: 0.6         # lower expectation (platform is casual)
    extra_rules:
      - "姐妹们"
      - "无广"           # paradoxically often indicates ad
      - "自用推荐"

  zhihu:  # 知乎
    domains: ["zhihu.com", "zhuanlan.zhihu.com"]
    weight_overrides:
      reasoning_quality: 1.3    # higher weight — Zhihu should have good reasoning
    extra_rules: []

  blog:  # 技术博客
    domains: ["juejin.cn", "segmentfault.com", "cnblogs.com", "csdn.net"]
    weight_overrides:
      info_density: 1.3         # tech blogs should be info-dense
      timeliness: 0.8           # tech content ages faster
    extra_rules:
      - "转载请注明"    # repost indicator

  default:
    weight_overrides: {}
    extra_rules: []



# Thunder — real-time content stream monitoring
# Inspired by x-algorithm's Thunder service
thunder:
  enabled: true
  
  # Content sources to monitor
  sources:
    - name: "hacker-news"
      type: rss
      url: "https://hnrss.org/newest"
      poll_interval_seconds: 300    # every 5 minutes
      priority: 5
      enabled: true
    
    - name: "36kr"  
      type: rss
      url: "https://36kr.com/feed"
      poll_interval_seconds: 600    # every 10 minutes
      priority: 5
      enabled: true
    
    - name: "ruanyifeng-weekly"
      type: rss
      url: "https://www.ruanyifeng.com/blog/atom.xml"
      poll_interval_seconds: 3600   # every hour
      priority: 3
      enabled: true

  # Webhook endpoint (receives POST requests with content URLs)
  webhook:
    enabled: true
    path: "/webhook/content"   # POST here to submit content for scoring

# Dispatcher — task scheduling and execution
# Inspired by x-algorithm's Dispatcher + Engine pattern  
dispatcher:
  max_in_flight: 3              # max concurrent LLM scoring tasks
  retry:
    max_attempts: 3
    base_delay_seconds: 2.0
    max_delay_seconds: 60.0
    exponential_base: 2.0
  
  # Rate limiting
  max_tasks_per_minute: 20      # prevent runaway costs
  
  # Graceful shutdown timeout
  shutdown_timeout_seconds: 30


# API rate limiting
rate_limiting:
  authenticated_rpm: 30       # requests/minute for authenticated users
  anonymous_rpm: 10           # requests/minute for anonymous (by IP)
  global_rpm: 100             # total requests/minute across all users
  score_endpoint_rpm: 10      # stricter limit for /score (LLM cost control)
  burst_allowance: 5          # extra burst allowed above limit
